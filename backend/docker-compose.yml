version: '3.8'

services:
  api:
    build: .
    container_name: socrates-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - WORKSPACE_PATH=/app/workspace
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./workspace:/app/workspace
